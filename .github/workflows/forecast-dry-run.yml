name: BTC ETH Forecast - Development Dry Run

on:
  push:
    branches:
      - feature/coinglass-api
    paths:
      - '.github/workflows/forecast-dry-run.yml'
      - 'daily_forecast_job.py'
      - 'forecast_backtest.py'
      - 'forecast_storage.py'

permissions:
  contents: read

jobs:
  forecast-dry-run:
    name: Generate forecasts without saving
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out development code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install forecasting dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scikit-learn yfinance

      - name: Validate Python files
        run: |
          python -m py_compile daily_forecast_job.py forecast_backtest.py forecast_storage.py

      - name: Run BTC and ETH forecasts (dry run only)
        run: python daily_forecast_job.py --asset both
