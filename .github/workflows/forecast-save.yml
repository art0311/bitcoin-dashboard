name: BTC ETH Forecast - Development Save Test

# One controlled save test on the development branch.
# Not scheduled and not triggered by ordinary code changes.
on:
  push:
    branches:
      - feature/coinglass-api
    paths:
      - '.github/workflows/forecast-save.yml'

permissions:
  contents: read

# Prevent concurrent jobs from issuing duplicate same-day predictions.
concurrency:
  group: crypto-forecast-development-save
  cancel-in-progress: false

jobs:
  save-forecasts:
    name: Generate and save BTC ETH forecasts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install forecasting dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scikit-learn yfinance

      - name: Check source files
        run: |
          python -m py_compile daily_forecast_job.py forecast_backtest.py forecast_storage.py

      - name: Confirm required Supabase secrets exist
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo 'Missing SUPABASE_URL'; exit 1; }
          test -n "$SUPABASE_KEY" || { echo 'Missing SUPABASE_KEY'; exit 1; }
          echo 'Supabase credentials are configured.'

      - name: Generate and save forecasts to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python daily_forecast_job.py --asset both --save
