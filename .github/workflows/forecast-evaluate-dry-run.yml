name: BTC ETH Forecast - Evaluation Dry Run

on:
  push:
    branches:
      - feature/coinglass-api
    paths:
      - '.github/workflows/forecast-evaluate-dry-run.yml'

permissions:
  contents: read

jobs:
  evaluate-dry-run:
    name: Check matured forecasts without changing database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out development code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install market data dependencies
        run: python -m pip install pandas yfinance
      - name: Validate evaluator
        run: python -m py_compile evaluate_forecasts.py forecast_storage.py
      - name: Evaluate matured forecasts (dry run only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python evaluate_forecasts.py
